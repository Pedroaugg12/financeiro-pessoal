<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232557d6'/><g fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'><path d='M9 22V14'/><path d='M16 22V9'/><path d='M23 22V17'/></g></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sistema de controle financeiro" />
    <title>Financeiro</title>
    <script>
      // Aplica o tema antes da primeira pintura para não piscar branco ao carregar.
      try {
        var t = localStorage.getItem('fin.tema')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        if (localStorage.getItem('fin.densidade') === 'compacta') {
          document.documentElement.classList.add('density-compact')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
